version: '3.8'

services:
  app:
    build: .
    restart: always
    expose:
      - "8000"
    environment:
      - DB_PATH=/app/data/avia.db
    volumes:
      - ./data:/app/data

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app